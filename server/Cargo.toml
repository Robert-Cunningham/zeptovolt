[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = { version = "1.4.0", features=["std"]}
flate2 = "1.0.25"
futures = "0.3.26"
reqwest = { version = "0.11.14", features = ["gzip"] }
serde_json = "1.0.93"
tokio = { version = "1", features = ["full"] }
