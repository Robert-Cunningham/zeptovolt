[package]
name = "server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-macros = "0.5.1"
bytes = { version = "1.11.1", features = ["std"] }
env_logger = "0.11.10"
flate2 = "1.1.9"
futures = { version = "0.3.32", features = ["std"] }
indicatif = "0.18.4"
log = "0.4.29"
rayon = "1.12.0"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["gzip"] }
roaring = "0.11.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }

[[bench]]
name = "search"
harness = false
