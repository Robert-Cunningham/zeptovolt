[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.69"
axum = "0.6.6"
bytes = { version = "1.4.0", features=["std"]}
enum-as-inner = "0.5.1"
flate2 = "1.0.25"
futures = {version = "0.3.26", features=["std"]}
indicatif = "0.17.3"
lazy_static = "1.4.0"
par-stream = "0.10.2"
rayon = "1.6.1"
redis = "0.22.3"
regex = "1.7.1"
reqwest = { version = "0.11.14", features = ["gzip"] }
serde = {version = "1.0.152", features = ["derive"]}
serde_json = "1.0.93"
tokio = { version = "1", features = ["full"] }
tower = "0.4.13"
tower-http = {version = "0.3.5", features = ["cors"]}
